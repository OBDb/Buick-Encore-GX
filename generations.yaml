generations:
  - name: "First Generation (2020-2023)"
    start_year: 2020
    end_year: 2023
    description: "The first-generation Buick Encore GX is a subcompact luxury crossover built on the GM VSS-F platform (9BXX), positioned between the smaller Encore and larger Envision in Buick's lineup. Despite sharing the Encore name, it is a completely different vehicle than the original Encore. Power comes from either a 1.2L turbocharged three-cylinder engine producing 137 HP or a 1.3L turbocharged three-cylinder with 155 HP, paired with either a CVT (front-wheel drive) or nine-speed automatic (all-wheel drive) transmission. The interior features premium materials, an 8-inch infotainment display with wireless Apple CarPlay and Android Auto, and up to 50.2 cubic feet of cargo space with the rear seats folded. Safety technology includes standard automatic emergency braking, lane-keeping assist, and available adaptive cruise control."

  - name: "First Generation (2024 Facelift)"
    start_year: 2024
    end_year: null
    description: "The 2024 Encore GX received a comprehensive facelift unveiled in 2023, adopting Buick's new Pure Design philosophy and updated corporate emblem. The exterior features bold, more upscale styling with a sleeker profile, forward-leaning front end, sharp character lines, and distinctive wraparound lighting elements. The interior was refreshed with a more premium appearance featuring a 'Virtual Cockpit' composed of an 8-inch digital instrument cluster and 11-inch infotainment touchscreen in a single panel. The powertrain continued with the 1.3L turbocharged three-cylinder engine producing 155 HP and 174 lb-ft of torque, paired with a CVT for front-wheel drive models or a 9-speed automatic for all-wheel drive variants. Trim levels changed with the base Preferred, mid-level ST, and luxury-oriented Avenir. The facelift brought improved technology with wireless device charging, enhanced driver assistance systems, and Buick's QuietTuning sound insulation features."
